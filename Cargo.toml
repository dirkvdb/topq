[package]
name = "topq"
version = "0.1.0"
edition = "2024"
description = "A minimal MQTT explorer built with GPUI Kit"

[package.metadata.bundle]
name = "TopQ"
identifier = "app.topq"
icon = ["dist/build/icon_512x512.png", "dist/build/icon_512x512@2x.png"]
category = "Developer Tool"

[dependencies]
anyhow = "1"
anstyle-parse = "1"
bytes = "1"
chrono = "0.4"
directories = "6"
gpui-kit = { version = "0.7", features = ["tree-sitter"] }
keyring = { version = "4.2", default-features = false, features = ["v1"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
percent-encoding = "2.3"
url = "2.5"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
keyring-core = "1"
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"

[profile.dev]
debug = 0

[profile.test]
debug = 0
