[package]
name = "topq"
version = "0.1.0"
edition = "2024"
description = "A minimal MQTT explorer built with GPUI Kit"

[dependencies]
anyhow = "1"
bytes = "1"
chrono = "0.4"
directories = "6"
gpui-kit = { version = "0.7", features = ["tree-sitter"] }
hotpath = "0.28"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls", "websocket"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[features]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
hotpath-cpu = ["hotpath", "hotpath/hotpath-cpu"]

[dev-dependencies]
gpui-kit = { version = "0.7", features = ["test-support"] }
keyring-core = "1"
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }

[lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.profiling]
inherits = "release"
debug = true
