# Native Windows packaging tools; use the runner's MSVC compiler and SDK.
[settings]
dotnet.isolated = true

[tools]
just = "1.51.0"
dotnet = "8"
rust = { version = "1.95.0", profile = "minimal" }
"cargo:cargo-bundle" = { version = "0.12.0", locked = true }

[env]
RUSTUP_HOME = "{{config_root}}/build/rustup-home"
CARGO_HOME = "{{config_root}}/build/cargo-home"
CARGO_TARGET_DIR = "{{config_root}}/build"
