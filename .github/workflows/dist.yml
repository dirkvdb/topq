name: Distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      MISE_DEFAULT_CONFIG_FILENAME: dist/mise.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@v6


      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Set up mise and packaging tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.4
          mise_dir: ${{ runner.temp }}/mise

          cache: false

      - name: Build macOS bundle
        run: mise exec -- just dmg
        env:
          MISE_BIN: ${{ runner.temp }}/mise/bin/mise

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: TopQ-macOS-${{ runner.arch }}
          path: dist/build/release/bundle/dmg/TopQ.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      MISE_DEFAULT_CONFIG_FILENAME: dist/mise.windows.toml
    steps:
      - name: Check out repository
        uses: actions/checkout@v6


      - name: Set up MSVC compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up mise and packaging tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.10.4
          cache: false

      - name: Build Windows MSI
        run: mise exec -- just msi

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v6
        with:
          name: TopQ-Windows-${{ runner.arch }}
          path: dist/build/release/bundle/wxsmsi/bin/Release/topq.msi
          if-no-files-found: error
