name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Install devenv
        uses: cachix/devenv-install-action@v1

      - name: Run CI checks
        run: devenv tasks run ci
